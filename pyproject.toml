[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-harness"
version = "0.3.0"
description = "Reusable fault injection and state verification for tool-using applications"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["opentelemetry-sdk>=1.36,<2"]

[project.optional-dependencies]
adk = ["google-adk>=2.8,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
agent-reliability = "agent_reliability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
